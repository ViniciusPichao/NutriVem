<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NutriVem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>NutriVem 🥗</h1>
    <p class="desc">Insira seus dados de glicemia para receber recomendações alimentares.</p>

    <div class="form">
      <label>Glicemia em jejum (mg/dL)</label>
      <input type="number" id="jejum">

      <label>Glicemia pós-refeição (mg/dL)</label>
      <input type="number" id="pos">

      <label>Hemoglobina glicada (%)</label>
      <input type="number" step="0.1" id="hba1c">

      <button onclick="analisar()">Analisar</button>
    </div>

    <div id="resultado" class="resultado"></div>

    <p class="aviso">
      ⚠️ Este sistema é apenas informativo e não substitui orientação médica.
    </p>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
